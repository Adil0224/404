services:
  - type: web
    name: akniet-clinic-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: akniet-clinic-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"

databases:
  - name: akniet-clinic-db
    plan: free
    region: frankfurt
    databaseName: akniet_clinic
    user: akniet
    postgresMajorVersion: "16"
